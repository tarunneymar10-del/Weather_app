<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-sky="clear-day">
<main>
  <form id="search" role="search">
    <input id="q" type="search" placeholder="Search for a city" aria-label="City name" autocomplete="off">
    <button type="submit">Search</button>
    <button type="button" id="locate" title="Use my location" aria-label="Use my location">Locate me</button>
  </form>

  <p id="status" role="status" aria-live="polite">Search for a city or use your location.</p>

  <section id="current" hidden>
    <h1 id="place"></h1>
    <p id="condition"></p>
    <p id="temp"></p>
    <dl id="details">
      <div><dt>Feels like</dt><dd id="feels"></dd></div>
      <div><dt>Humidity</dt><dd id="humidity"></dd></div>
      <div><dt>Wind</dt><dd id="wind"></dd></div>
    </dl>
    <button type="button" id="unit" aria-label="Switch temperature unit">Switch to °F</button>
  </section>

  <section id="forecast-wrap" hidden>
    <h2>Next 7 days</h2>
    <ul id="forecast"></ul>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
